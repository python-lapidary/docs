[tool.poetry]
name = "lapidary-docs"
version = "0.10.0"
description = "Docs for Lapidary"
authors = ["Raphael Krupinski <rafalkrupinski@users.noreply.github.com>"]
license = "CC-BY-SA"
readme = "Readme.md"
package-mode = false


[tool.poetry.dependencies]
python = '^3.10'
mkdocs = "^1"
mkdocs-material = "^9"
mkdocs-monorepo-plugin = "^1"
mkdocstrings = {extras = ["python"], version = "^0.29"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
